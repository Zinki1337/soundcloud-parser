<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация аккаунта</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>

    <div class="auth-container">
        <h2>Регистрация</h2>
        
        <div class="input-group">
            <label for="username">Придумайте логин</label>
            <input type="text" id="username" placeholder="Минимум 3 символа" autocomplete="off">
        </div>
        
        <div class="input-group">
            <label for="password">Придумайте пароль</label>
            <input type="password" id="password" placeholder="Минимум 6 символов">
        </div>
        
        <button class="auth-btn" onclick="handleRegister()">Создать аккаунт</button>
        <div id="error-box" class="error-msg"></div>
        <div id="success-box" class="success-msg"></div>
        
        <div class="switch-link">
            Уже есть аккаунт? <a href="/login_page">Войти</a>
        </div>
    </div>

    <script>
        async function handleRegister() {
            const userInp = document.getElementById('username').value.trim();
            const passInp = document.getElementById('password').value.trim();
            const errorBox = document.getElementById('error-box');
            const successBox = document.getElementById('success-box');
            
            errorBox.style.display = 'none';
            successBox.style.display = 'none';

            if (userInp.length < 3 || passInp.length < 6) {
                errorBox.innerText = "Логин от 3 символов, пароль от 6 символов";
                errorBox.style.display = 'block';
                return;
            }

            try {
                let res = await fetch('/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: userInp, password: passInp})
                });
                
                let data = await res.json();
                
                if (res.ok) {
                    successBox.innerText = "Регистрация успешна! Перенаправление...";
                    successBox.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = '/login_page';
                    }, 1500);
                } else {
                    errorBox.innerText = data.message || "Ошибка регистрации";
                    errorBox.style.display = 'block';
                }
            } catch (err) {
                errorBox.innerText = "Ошибка соединения с сервером";
                errorBox.style.display = 'block';
            }
        }
    </script>
</body>
</html>
